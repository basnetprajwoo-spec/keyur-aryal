
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Login Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffc0cb, #ff69b4);
        }

        .login-box {
            width: 350px;
            padding: 40px 30px;
            background: #fff0f5;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(180, 50, 100, 0.25);
            text-align: center;
        }

        .login-box h2 {
            color: #e75480;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .login-box p {
            color: #b45b79;
            margin-bottom: 25px;
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box input {
            width: 100%;
            padding: 13px;
            border: 2px solid #ffc0cb;
            border-radius: 10px;
            outline: none;
            background: white;
            font-size: 15px;
        }

        .input-box input:focus {
            border-color: #e75480;
        }

        .forgot {
            text-align: left;
            margin-bottom: 20px;
        }

        .forgot a {
            color: #e75480;
            text-decoration: none;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #ff69b4;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e75480;
            transform: scale(1.03);
        }

        .signup {
            margin-top: 25px;
            color: #b45b79;
            font-size: 14px;
        }

        .signup a {
            color: #e75480;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">
       
        <p>Login form</p>

        <form>
            <div class="input-box">
                <input type="email" placeholder="Enter your Email" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Enter your Password" required>
            </div>

            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>
        </form>

        <div class=" signup ">
           
            <a href="#"> not a member? Sign Up</a>
        </div>
    </div>

</body>
</html>
